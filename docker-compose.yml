version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/financial_db
      JWT_SECRET: change-this-in-production-to-a-secure-random-string
      JWT_REFRESH_SECRET: change-this-refresh-secret-in-production
      PORT: "3000"
      NODE_ENV: production
      FRONTEND_URL: http://localhost:80
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
