<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>FinTrack — Personal Finance Management</title>
    <meta name="title" content="FinTrack — Personal Finance Management" />
    <meta name="description" content="Track income, expenses, budgets, investments, and savings goals in one place. FinTrack helps you manage your finances with beautiful charts and actionable insights." />
    <meta name="keywords" content="personal finance, budget tracker, expense tracker, investment portfolio, savings goals, financial management, money tracker" />
    <meta name="author" content="FinTrack" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://fintrack.app" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fintrack.app" />
    <meta property="og:title" content="FinTrack — Personal Finance Management" />
    <meta property="og:description" content="Track income, expenses, budgets, investments, and savings goals in one place. Beautiful charts and actionable insights." />
    <meta property="og:image" content="https://fintrack.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="FinTrack" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://fintrack.app" />
    <meta name="twitter:title" content="FinTrack — Personal Finance Management" />
    <meta name="twitter:description" content="Track income, expenses, budgets, investments, and savings goals in one place." />
    <meta name="twitter:image" content="https://fintrack.app/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="msapplication-TileColor" content="#2563eb" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "FinTrack",
      "url": "https://fintrack.app",
      "description": "Personal finance management application for tracking income, expenses, budgets, investments, and savings goals.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Expense tracking",
        "Budget management",
        "Investment portfolio",
        "Savings goals",
        "Recurring transactions",
        "Tax reports"
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "FinTrack",
      "url": "https://fintrack.app",
      "logo": "https://fintrack.app/logo.png"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
